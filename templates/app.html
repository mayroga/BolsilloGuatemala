<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BolsilloGuatemala</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <!-- Pantalla Despejada Tipo Ventana que Esconde Todo al Dar Respuesta Real -->
    <div id="ventanaEnfoque" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#ffffff; z-index:9999; padding:20px; box-sizing:border-box; overflow-y:auto;">
        <div style="max-width:700px; margin:40px auto; background:#f8fafc; border:1px solid #cbd5e1; border-radius:12px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.1);">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:12px; margin-bottom:20px;">
                <h2 style="margin:0; font-size:20px; color:#1e293b;">Resultado Oficial Encontrado</h2>
                <button onclick="cerrarVentanaEnfoque()" style="background:#ef4444; color:white; border:none; padding:8px 14px; border-radius:6px; cursor:pointer; font-weight:bold;">Cerrar Ventana</button>
            </div>
            <div id="contenidoVentanaEnfoque" style="font-size:16px; color:#334155; line-height:1.6; white-space:pre-wrap; margin-bottom:20px;"></div>
            <div id="botonesVentanaEnfoque" style="display:flex; gap:10px; flex-wrap:wrap;"></div>
        </div>
    </div>

    <!-- Reloj de Cierre Automático a los 20 Minutos -->
    <div id="relojContenedor" style="position:fixed; top:10px; right:15px; background:#1e293b; color:#ffffff; padding:6px 12px; border-radius:20px; font-size:12px; font-weight:bold; z-index:998;">
        Cierre automático en: <span id="tiempoRestante">20:00</span>
    </div>

    <main class="container">
        <h1 id="secretClicker">BolsilloGuatemala</h1>
        <p class="subtitle">{{ saludo_dinamico }}</p>
        
        <!-- Sección de Guía Vial y SAT con búsqueda automática -->
        <section style="background:#f1f5f9; padding:15px; border-radius:8px; margin-bottom:20px;">
            <h3 style="margin-top:0; font-size:16px; color:#0f172a;">Revisión Automática de Vehículos y Multas</h3>
            <p style="font-size:13px; color:#475569;">Escribe tu DPI (13 números exactos) y tu placa. El sistema buscará por ti en todos lados:</p>
            <input type="text" id="inputDpi" placeholder="Tu número de DPI (13 dígitos)" maxlength="13" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
            <input type="text" id="inputPlaca" placeholder="Número de Placa (Ej. P-123ABC)" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box;">
            <div style="display:flex; gap:10px;">
                <button onclick="consultarSatVehiculos()" style="flex:1; background:#0284c7; color:white; border:none; padding:10px; border-radius:6px; cursor:pointer; font-weight:bold;">Buscar en SAT</button>
                <button onclick="consultarTramitesLocales('multas')" style="flex:1; background:#0d9488; color:white; border:none; padding:10px; border-radius:6px; cursor:pointer; font-weight:bold;">Buscar Multas</button>
            </div>
        </section>

        <!-- Caja de Consulta General -->
        <div style="margin-bottom:20px;">
            <textarea id="inputConsulta" placeholder="Escribe aquí lo que necesitas buscar o resolver..." style="width:100%; height:90px; padding:10px; border:1px solid #cbd5e1; border-radius:6px; box-sizing:border-box; font-family:inherit;"></textarea>
            <button onclick="enviarConsultaGeneral()" style="width:100%; background:#16a34a; color:white; border:none; padding:12px; border-radius:6px; cursor:pointer; font-weight:bold; margin-top:8px;">Preguntar al Asesor</button>
        </div>

        <!-- Resultados de fondo -->
        <div id="resultadoContenedor" style="background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; padding:15px; min-height:80px; margin-bottom:20px; white-space:pre-wrap; font-size:15px; color:#334155;">
            Esperando tu consulta para buscar soluciones...
        </div>
        <div id="botonesContenedor" style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;"></div>

        <!-- Botón de Salida Voluntaria -->
        <button onclick="cerrarSesionVoluntaria()" style="background:#64748b; color:white; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; width:100%; font-weight:bold;">Cerrar y Salir</button>
    </main>

<script>
    // Reloj de Cierre Automático a los 20 Minutos
    let tiempoRestanteSegundos = 20 * 60;
    const relojIntervalo = setInterval(() => {
        tiempoRestanteSegundos--;
        let minutos = Math.floor(tiempoRestanteSegundos / 60);
        let segundos = tiempoRestanteSegundos % 60;
        document.getElementById("tiempoRestante").innerText = 
            (minutos < 10 ? "0" : "") + minutos + ":" + (segundos < 10 ? "0" : "") + segundos;
        
        if (tiempoRestanteSegundos <= 0) {
            clearInterval(relojIntervalo);
            alert("El tiempo de 20 minutos terminó por seguridad. Volviendo al inicio.");
            window.location.href = "/";
        }
    }, 1000);

    function cerrarSesionVoluntaria() {
        if (confirm("¿Quieres salir de la aplicación?")) {
            window.location.href = "/";
        }
    }

    // Funciones de Ventana Limpia de Enfoque (Esconde todo lo demás al dar la respuesta real)
    function abrirVentanaEnfoque(texto, botones) {
        document.getElementById("contenidoVentanaEnfoque").innerText = texto;
        let contenedorBotones = document.getElementById("botonesVentanaEnfoque");
        contenedorBotones.innerHTML = "";
        
        if (botones && botones.length > 0) {
            botones.forEach(btn => {
                let a = document.createElement("a");
                a.href = btn.url;
                a.target = "_blank";
                a.innerText = btn.texto;
                a.style.cssText = "display:inline-block; background:#2563eb; color:white; padding:10px 16px; border-radius:6px; text-decoration:none; font-weight:bold; font-size:14px;";
                contenedorBotones.appendChild(a);
            });
        }
        
        document.getElementById("ventanaEnfoque").style.display = "block";
    }

    function cerrarVentanaEnfoque() {
        document.getElementById("ventanaEnfoque").style.display = "none";
    }

    // Validación sencilla de DPI real de 13 dígitos
    function validarDpiIngresado() {
        let dpi = document.getElementById("inputDpi").value.trim();
        if (dpi.length !== 13 || isNaN(dpi)) {
            alert("Falta un pedacito o un número. Tu DPI debe tener exactamente 13 números para que el sistema pueda buscar.");
            document.getElementById("inputDpi").focus();
            return false;
        }
        return true;
    }

    async function consultarSatVehiculos() {
        if (!validarDpiIngresado()) return;
        
        let dpi = document.getElementById("inputDpi").value.trim();
        let placa = document.getElementById("inputPlaca").value.trim();

        try {
            let res = await fetch("/tramites_sat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ dpi, placa })
            });
            let data = await res.json();
            
            if (data.error_dpi) {
                alert(data.respuesta);
                return;
            }

            // Abre la ventana limpia y esconde todo lo demás
            abrirVentanaEnfoque(data.respuesta, data.botones);
            document.getElementById("resultadoContenedor").innerText = data.respuesta;
            renderizarBotones(data.botones);
        } catch (err) {
            alert("No se pudo conectar con el servidor.");
        }
    }

    async function consultarTramitesLocales(tipo) {
        let dpi = document.getElementById("inputDpi").value.trim();
        if (!validarDpiIngresado()) return;

        try {
            let res = await fetch("/tramites_locales", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tipo, dpi })
            });
            let data = await res.json();
            
            if (data.error_dpi) {
                alert(data.respuesta);
                return;
            }

            abrirVentanaEnfoque(data.respuesta, data.botones);
            document.getElementById("resultadoContenedor").innerText = data.respuesta;
            renderizarBotones(data.botones);
        } catch (err) {
            alert("No se pudo conectar con el servidor.");
        }
    }

    async function enviarConsultaGeneral() {
        let mensaje = document.getElementById("inputConsulta").value.trim();
        if (!mensaje) {
            alert("Escribe qué deseas consultar.");
            return;
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async (pos) => {
                await ejecutarPeticionGeneral(mensaje, pos.coords.latitude, pos.coords.longitude);
            }, async () => {
                await ejecutarPeticionGeneral(mensaje, null, null);
            });
        } else {
            await ejecutarPeticionGeneral(mensaje, null, null);
        }
    }

    async function ejecutarPeticionGeneral(mensaje, lat, lon) {
        try {
            let res = await fetch("/consultar", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ mensaje, lat, lon })
            });
            let data = await res.json();
            
            abrirVentanaEnfoque(data.respuesta, data.botones);
            document.getElementById("resultadoContenedor").innerText = data.respuesta;
            renderizarBotones(data.botones);
        } catch (err) {
            alert("Error al procesar la consulta.");
        }
    }

    function renderizarBotones(botones) {
        let contenedor = document.getElementById("botonesContenedor");
        contenedor.innerHTML = "";
        if (botones && botones.length > 0) {
            botones.forEach(btn => {
                let a = document.createElement("a");
                a.href = btn.url;
                a.target = "_blank";
                a.innerText = btn.texto;
                a.style.cssText = "display:inline-block; background:#0284c7; color:white; padding:8px 14px; border-radius:6px; text-decoration:none; font-size:14px; font-weight:bold;";
                contenedor.appendChild(a);
            });
        }
    }
</script>
</body>
</html>
